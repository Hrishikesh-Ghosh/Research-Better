<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generate Ideas – AI Research Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/ideas.css') }}">
</head>
<body>

<div class="page-wrapper">

  <a href="/dashboard" class="back-link">← Back to Dashboard</a>

  <!-- Controls -->
  <section class="controls-section" aria-label="Paper selection">
    <div class="paper-select-row">
      <span class="paper-select-label">CHOOSE A PAPER TO GENERATE IDEAS :</span>
      <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start;">
        <div class="select-wrapper">
          <select id="paper-select" aria-label="Choose a paper">
            <option value="">Select a paper…</option>
            <option value="__upload__">📂 Upload new PDF…</option>
          </select>
        </div>
        <input type="file" id="file-input" accept=".pdf" aria-hidden="true" />
        <div class="file-badge" id="file-badge" role="status">
          <span>📄</span>
          <span class="file-name" id="badge-filename"></span>
          <button class="remove-file" id="remove-file" aria-label="Remove uploaded file">✕</button>
        </div>
        <p class="upload-hint">
          Or <a id="upload-trigger" role="button" tabindex="0">click here to upload a PDF</a> from your computer
        </p>
      </div>
    </div>
    <button class="btn-generate" id="btn-generate" aria-label="Generate research ideas">
      Generate Ideas
    </button>
  </section>

  <!-- Placeholder -->
  <div class="state-placeholder" id="state-placeholder" role="status">
    <span class="icon">⚡</span>
    <p>Select or upload a research paper above, then click <strong>Generate Ideas</strong> to get future research directions.</p>
  </div>

  <!-- Results -->
  <article class="results-box" id="results-box" aria-live="polite">
    <div class="results-header">
      <div>
        <h1 class="results-paper-title" id="results-paper-title"></h1>
        <p class="ideas-subtitle" id="ideas-subtitle"></p>
      </div>
      <button class="btn-export" id="btn-export" aria-label="Export as PDF">⬇ Export PDF</button>
    </div>
    <div class="ideas-grid" id="ideas-grid"></div>
  </article>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="{{ url_for('static', filename='js/ideas.js') }}"></script>
</body>
</html>
